name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The package version comes from version.json (Nerdbank.GitVersioning), not from
      # the tag. Stop here if they disagree, before anything is built or published.
      - name: Check release tag matches version.json
        run: bash eng/check-release-tag.sh "${{ github.ref_type }}" "${{ github.ref_name }}"
      - run: python3 eng/validate.py --report artifacts/static-validation.txt
      - run: dotnet restore Statesman.slnx
      - run: dotnet build Statesman.slnx --configuration Release --no-restore
      - run: >-
          dotnet test Statesman.slnx
          --configuration Release
          --no-build
      - name: Pack publishable projects
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.csproj' -print0 | sort -z | while IFS= read -r -d '' project; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts/packages
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
      - name: Create checksums
        run: |
          cd artifacts/packages
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt
      - name: NuGet login (OIDC to temp API key)
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        if: vars.NUGET_USER != ''
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
      # Re-running a tag's release must not fail because the GitHub release already
      # exists: NuGet pushes above skip duplicates, and this step re-uploads assets.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg artifacts/packages/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --generate-notes --verify-tag
          fi
