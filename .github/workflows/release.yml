name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: python3 eng/validate.py --report artifacts/static-validation.txt
      - run: dotnet restore Statesman.slnx
      - run: dotnet build Statesman.slnx --configuration Release --no-restore
      - run: >-
          dotnet test Statesman.slnx
          --configuration Release
          --no-build
      - name: Pack publishable projects
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.csproj' -print0 | sort -z | while IFS= read -r -d '' project; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts/packages
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
      - name: Create checksums
        run: |
          cd artifacts/packages
          sha256sum *.nupkg *.snupkg > SHA256SUMS.txt
      - name: Publish to NuGet
        if: env.NUGET_API_KEY != ''
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/packages/*.nupkg
          artifacts/packages/*.snupkg
          artifacts/packages/SHA256SUMS.txt
          --generate-notes
          --verify-tag
