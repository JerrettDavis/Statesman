name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository structure
        run: python3 eng/validate.py --report artifacts/static-validation.txt
      - name: Upload validation report
        uses: actions/upload-artifact@v7
        with:
          name: static-validation
          path: artifacts/static-validation.txt

  docs:
    needs: static-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Statesman.slnx
      - name: Install DocFX
        run: dotnet tool update --global docfx || dotnet tool install --global docfx
      - name: Build documentation site
        run: docfx docs/docfx.json
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site-preview
          path: docs/_site

  redis-tests:
    needs:
      - static-validation
      - docs
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STATESMAN_TEST_REDIS: localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: global.json
      - name: Restore
        run: dotnet restore Statesman.slnx
      - name: Build
        run: dotnet build Statesman.slnx --configuration Release --no-restore
      # One invocation per project: Microsoft.Testing.Platform passes extra project paths
      # to the first project's runner as arguments, which then reports "Zero tests ran".
      - name: Test
        run: |
          dotnet test tests/Statesman.Redis.Tests/Statesman.Redis.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Outbox.Redis.Tests/Statesman.Outbox.Redis.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Tooling.Tests/Statesman.Tooling.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Conformance.Tests/Statesman.Conformance.Tests.csproj --configuration Release --no-build

  sqlserver-tests:
    needs:
      - static-validation
      - docs
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Statesman!Test1"
        # A SQL Server container takes tens of seconds to accept connections, so the retry budget is
        # much wider than redis-tests'. sqlcmd lives under /opt/mssql-tools18 and needs -C to trust
        # the container's self-signed certificate.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Statesman!Test1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      STATESMAN_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Statesman!Test1;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: global.json
      - name: Restore
        run: dotnet restore Statesman.slnx
      - name: Build
        run: dotnet build Statesman.slnx --configuration Release --no-restore
      # One invocation per project: Microsoft.Testing.Platform passes extra project paths
      # to the first project's runner as arguments, which then reports "Zero tests ran".
      - name: Test
        run: |
          dotnet test tests/Statesman.EntityFrameworkCore.Tests/Statesman.EntityFrameworkCore.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Outbox.EntityFrameworkCore.Tests/Statesman.Outbox.EntityFrameworkCore.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Conformance.Tests/Statesman.Conformance.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Tooling.Tests/Statesman.Tooling.Tests.csproj --configuration Release --no-build
      # ROADMAP 0.3 Phase 13: the same suites again under the provider's retrying execution strategy.
      # One extra step inside the job that already has the engine up, rather than a fourth matrix
      # dimension that would double one of the slowest jobs in the build.
      - name: Test under a retrying execution strategy
        env:
          STATESMAN_TEST_EF_RETRY: "1"
        run: |
          dotnet test tests/Statesman.EntityFrameworkCore.Tests/Statesman.EntityFrameworkCore.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Conformance.Tests/Statesman.Conformance.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Tooling.Tests/Statesman.Tooling.Tests.csproj --configuration Release --no-build

  postgres-tests:
    needs:
      - static-validation
      - docs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: statesman
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      STATESMAN_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=statesman
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: global.json
      - name: Restore
        run: dotnet restore Statesman.slnx
      - name: Build
        run: dotnet build Statesman.slnx --configuration Release --no-restore
      # One invocation per project, for the same reason redis-tests splits them.
      - name: Test
        run: |
          dotnet test tests/Statesman.EntityFrameworkCore.Tests/Statesman.EntityFrameworkCore.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Outbox.EntityFrameworkCore.Tests/Statesman.Outbox.EntityFrameworkCore.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Conformance.Tests/Statesman.Conformance.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Tooling.Tests/Statesman.Tooling.Tests.csproj --configuration Release --no-build
      # ROADMAP 0.3 Phase 13: the same suites again under the provider's retrying execution strategy.
      # One extra step inside the job that already has the engine up, rather than a fourth matrix
      # dimension that would double one of the slowest jobs in the build.
      - name: Test under a retrying execution strategy
        env:
          STATESMAN_TEST_EF_RETRY: "1"
        run: |
          dotnet test tests/Statesman.EntityFrameworkCore.Tests/Statesman.EntityFrameworkCore.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Conformance.Tests/Statesman.Conformance.Tests.csproj --configuration Release --no-build
          dotnet test tests/Statesman.Tooling.Tests/Statesman.Tooling.Tests.csproj --configuration Release --no-build

  build-test:
    needs:
      - static-validation
      - docs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: global.json
      - name: Restore
        run: dotnet restore Statesman.slnx
      - name: Build
        run: dotnet build Statesman.slnx --configuration Release --no-restore
      - name: Test
        run: >-
          dotnet test Statesman.slnx
          --configuration Release
          --no-build
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**
            artifacts/test-results/${{ matrix.os }}
          if-no-files-found: warn

  coverage:
    needs: build-test
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: global.json
      - name: Restore
        run: dotnet restore Statesman.slnx
      - name: Build
        run: dotnet build Statesman.slnx --configuration Release --no-restore
      - name: Test with coverage
        run: >-
          dotnet test Statesman.slnx
          --configuration Release
          --no-build
          --results-directory artifacts/coverage-results
          --coverage
          --coverage-output-format cobertura
      - name: Install ReportGenerator
        run: dotnet tool update --global dotnet-reportgenerator-globaltool || dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Combine coverage and create reports
        shell: bash
        run: |
          set -euo pipefail
          REPORTS=$(find artifacts/coverage-results -type f -name '*.cobertura.xml' | tr '\n' ';')
          if [ -z "$REPORTS" ]; then
            echo "No coverage reports found."
            exit 1
          fi
          reportgenerator \
            -reports:"$REPORTS" \
            -targetdir:"coverage-report" \
            -reporttypes:"HtmlInline;Cobertura;TextSummary;lcov;Badges" \
            -assemblyfilters:"+Statesman*;-*Tests*" \
            -filefilters:"-**/*.Tests/*;-**/*Tests*/**"
          echo "COVERAGE_SUMMARY<<EOF" >> "$GITHUB_ENV"
          cat coverage-report/Summary.txt >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report
      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          message: |
            ## Code Coverage
            ```
            ${{ env.COVERAGE_SUMMARY }}
            ```
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage-report/Cobertura.xml
          flags: unittests
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}
          verbose: true

  pack:
    needs:
      - build-test
      - coverage
      - redis-tests
      - sqlserver-tests
      - postgres-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: global.json
      - run: dotnet restore Statesman.slnx
      - run: dotnet build Statesman.slnx --configuration Release --no-restore
      - name: Pack publishable projects
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.csproj' -print0 | sort -z | while IFS= read -r -d '' project; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts/packages
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
