name: Bug report
description: Report incorrect runtime, provider, analyzer, or tooling behavior
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thank you for helping make Statesman reliable. Please remove secrets and state payloads from diagnostics.
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: Statesman 0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Declaration and manifest
        - Runtime and concurrency
        - Observation
        - In-memory provider
        - Filesystem provider
        - Redis provider
        - EF Core provider
        - Tiered provider
        - ASP.NET Core or HTTP
        - Analyzer
        - Build or documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the declaration, operation, expected revision, and provider configuration when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
